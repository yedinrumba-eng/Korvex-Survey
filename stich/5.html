<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact Information</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#33343e",
                        "tertiary-fixed-dim": "#ffb59f",
                        "on-surface": "#e3e1ee",
                        "on-secondary": "#262f4b",
                        "primary-fixed-dim": "#bdc2ff",
                        "on-secondary-fixed-variant": "#3d4662",
                        "on-surface-variant": "#c5c5d9",
                        "on-background": "#e3e1ee",
                        "surface-dim": "#12131c",
                        "on-secondary-fixed": "#111a35",
                        "surface-container-low": "#1a1b24",
                        "primary-fixed": "#dfe0ff",
                        "on-primary-fixed": "#000964",
                        "on-tertiary-fixed-variant": "#862300",
                        "tertiary-fixed": "#ffdbd1",
                        "primary-container": "#2f43ea",
                        "surface-tint": "#bdc2ff",
                        "inverse-primary": "#3347ed",
                        "on-tertiary-fixed": "#3a0a00",
                        "surface-container-high": "#292933",
                        "error-container": "#93000a",
                        "outline-variant": "#444656",
                        "tertiary-container": "#aa2f00",
                        "on-error-container": "#ffdad6",
                        "background": "#12131c",
                        "error": "#ffb4ab",
                        "on-tertiary": "#5f1600",
                        "secondary-container": "#3f4865",
                        "inverse-surface": "#e3e1ee",
                        "on-secondary-container": "#aeb7d9",
                        "surface-container": "#1e1f28",
                        "outline": "#8f8fa2",
                        "primary": "#bdc2ff",
                        "inverse-on-surface": "#2f303a",
                        "secondary-fixed": "#dbe1ff",
                        "secondary-fixed-dim": "#bcc5e8",
                        "surface-bright": "#383843",
                        "on-primary-container": "#ced1ff",
                        "tertiary": "#ffb59f",
                        "on-tertiary-container": "#ffc8b8",
                        "surface-container-lowest": "#0d0e16",
                        "on-primary-fixed-variant": "#0925d7",
                        "on-error": "#690005",
                        "surface-variant": "#33343e",
                        "surface": "#12131c",
                        "on-primary": "#00159e",
                        "secondary": "#bcc5e8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "48px",
                        "margin-edge": "32px",
                        "container-max-width": "720px",
                        "progress-bar-height": "4px",
                        "gutter-md": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "counter-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "counter-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0a0c14; /* Using specific requested background */
        }
        /* Custom input styles for the requested thin underline look */
        .input-line {
            background: transparent;
            border: none;
            border-bottom: 1px solid #262c45;
            border-radius: 0;
            padding: 8px 0;
            color: #e3e1ee;
            width: 100%;
        }
        .input-line:focus {
            outline: none;
            border-bottom-color: #2f43ea;
            box-shadow: none;
        }
    </style>
</head>
<body class="text-on-background h-screen flex flex-col overflow-hidden relative">
<!-- Progress Bar -->
<div class="fixed top-0 left-0 w-full h-progress-bar-height bg-surface-container-highest z-50">
<div class="h-full bg-primary-container" style="width: 90%;"></div>
</div>
<!-- Top App Bar Shell -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-edge py-4 border-t-4 border-primary bg-background text-primary font-label-md text-label-md mt-1">
<div class="font-label-md text-label-md font-bold text-on-surface tracking-wider">
            KORVEX DEV
        </div>
<div class="font-counter-sm text-counter-sm text-on-surface-variant flex items-center gap-1">
            16 <span class="material-symbols-outlined" style="font-size: 14px;">arrow_forward</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center w-full max-w-container-max-width mx-auto px-margin-edge mt-16 mb-24">
<div class="w-full flex flex-col gap-8">
<!-- Question Header -->
<div class="flex flex-col gap-3">
<div class="inline-flex items-center self-start px-3 py-1 rounded-full border border-outline-variant bg-surface-container-low">
<span class="font-counter-sm text-counter-sm text-on-surface-variant uppercase tracking-wider">Opcional</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                    ¿A dónde te escribimos?
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Todos los campos son opcionales. Solo usamos estos datos para contactarte.
                </p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-6 w-full">
<!-- Field 1 -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant">Tu nombre</label>
<input class="input-line font-body-lg text-body-lg" placeholder="" type="text"/>
</div>
<!-- Field 2 -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant">Nombre del negocio</label>
<input class="input-line font-body-lg text-body-lg" placeholder="" type="text"/>
</div>
<!-- Field 3 -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant">Teléfono o WhatsApp</label>
<input class="input-line font-body-lg text-body-lg" placeholder="" type="tel"/>
</div>
<!-- Field 4 -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant">Correo electrónico</label>
<input class="input-line font-body-lg text-body-lg" placeholder="" type="email"/>
</div>
<!-- Submit Button -->
<div class="mt-8">
<button class="w-full md:w-auto px-8 py-4 bg-primary-container text-white font-label-md text-label-md font-medium rounded-lg hover:brightness-110 transition-all flex items-center justify-center gap-2" type="button">
                        Enviar respuestas
                        <span class="material-symbols-outlined">send</span>
</button>
</div>
</form>
</div>
</main>
<!-- Bottom Nav Bar Shell (Mobile Priority) -->
<footer class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-edge pb-10 max-w-container-max-width mx-auto bg-transparent">
<button class="font-label-md text-label-md text-on-surface-variant px-6 py-2 hover:text-primary transition-colors">
            Saltar
        </button>
<button class="font-label-md text-label-md bg-primary text-on-primary px-6 py-2 rounded-full hover:text-primary transition-colors opacity-80">
            Continuar
        </button>
</footer>
</body></html>
