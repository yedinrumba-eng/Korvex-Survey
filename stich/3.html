<!DOCTYPE html>

<html class="dark" lang="es"><head>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-md selection:bg-primary-container selection:text-white">
<!-- Progress Bar -->
<div class="fixed top-0 left-0 w-full h-progress-bar-height bg-surface-container-highest z-50">
<div class="h-full bg-primary-container w-1/2 transition-all duration-500 ease-out"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-margin-edge py-4 mt-progress-bar-height bg-background dark:bg-background border-t-4 border-primary flat no shadows">
<div class="font-label-md text-label-md font-bold text-on-surface tracking-wider uppercase">
            KORVEX DEV
        </div>
<div class="font-counter-sm text-counter-sm text-on-surface-variant flex items-center gap-2">
            12 <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center px-margin-edge w-full max-w-container-max-width mx-auto h-full overflow-hidden mt-16 mb-24">
<div class="w-full flex flex-col gap-stack-lg max-h-full">
<!-- Question Header -->
<div class="flex flex-col gap-4 text-center md:text-left">
<div class="inline-flex">
<span class="inline-block px-3 py-1 rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md bg-surface-container-low text-[12px] uppercase tracking-wider self-start md:self-auto mx-auto md:mx-0">
                        Puedes elegir varias
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                    La última vez que saliste, ¿cómo decidiste a dónde ir?
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Marca todo lo que aplique.
                </p>
</div>
<!-- Options Grid (Single Column) -->
<div class="flex flex-col gap-3 overflow-y-auto pr-2 pb-4 scrollbar-hide" style="scrollbar-width: none;">
<!-- Option 1: Selected -->
<button class="w-full text-left p-gutter-md rounded border border-primary-container bg-surface-container-low flex items-center justify-between group transition-colors duration-200">
<span class="font-body-lg text-body-lg text-on-surface">Recomendación de amigos</span>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 2: Unselected -->
<button class="w-full text-left p-gutter-md rounded border border-outline-variant bg-surface hover:border-primary-container/50 transition-colors duration-200 flex items-center justify-between group">
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Redes sociales, Instagram o TikTok</span>
<span class="material-symbols-outlined text-transparent group-hover:text-outline-variant/30 transition-colors">radio_button_unchecked</span>
</button>
<!-- Option 3: Unselected -->
<button class="w-full text-left p-gutter-md rounded border border-outline-variant bg-surface hover:border-primary-container/50 transition-colors duration-200 flex items-center justify-between group">
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Grupo de WhatsApp</span>
<span class="material-symbols-outlined text-transparent group-hover:text-outline-variant/30 transition-colors">radio_button_unchecked</span>
</button>
<!-- Option 4: Selected -->
<button class="w-full text-left p-gutter-md rounded border border-primary-container bg-surface-container-low flex items-center justify-between group transition-colors duration-200">
<span class="font-body-lg text-body-lg text-on-surface">Ya tenía el lugar en mente</span>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 5: Unselected -->
<button class="w-full text-left p-gutter-md rounded border border-outline-variant bg-surface hover:border-primary-container/50 transition-colors duration-200 flex items-center justify-between group">
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Google o mapas</span>
<span class="material-symbols-outlined text-transparent group-hover:text-outline-variant/30 transition-colors">radio_button_unchecked</span>
</button>
<!-- Option 6: Unselected -->
<button class="w-full text-left p-gutter-md rounded border border-outline-variant bg-surface hover:border-primary-container/50 transition-colors duration-200 flex items-center justify-between group">
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Fui a donde me invitaron</span>
<span class="material-symbols-outlined text-transparent group-hover:text-outline-variant/30 transition-colors">radio_button_unchecked</span>
</button>
<!-- Option 7: Unselected -->
<button class="w-full text-left p-gutter-md rounded border border-outline-variant bg-surface hover:border-primary-container/50 transition-colors duration-200 flex items-center justify-between group">
<span class="font-body-lg text-body-lg text-on-surface-variant group-hover:text-on-surface transition-colors">Otro</span>
<span class="material-symbols-outlined text-transparent group-hover:text-outline-variant/30 transition-colors">radio_button_unchecked</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-edge pb-10 max-w-container-max-width mx-auto bg-transparent flat no shadows pt-4 bg-gradient-to-t from-background via-background to-transparent">
<button class="font-label-md text-label-md text-on-surface-variant px-6 py-2 hover:text-primary transition-colors">
            Saltar
        </button>
<button class="font-label-md text-label-md bg-primary text-on-primary px-6 py-2 rounded-full hover:brightness-110 transition-all Active: opacity-80 flex items-center gap-2">
            Continuar <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</footer>
