<!DOCTYPE html>

<style>
        /* Custom styles to ensure no-scroll vertical centering */
        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

<body class="bg-background text-on-background">
<!-- Progress Bar (Absolute Top) -->
<div class="fixed top-0 left-0 w-full h-progress-bar-height bg-surface-container-highest z-50">
<div class="h-full bg-primary" style="width: 70%;"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-margin-edge py-4 bg-background dark:bg-background mt-progress-bar-height">
<div class="font-label-md text-label-md font-bold text-on-surface tracking-wider">KORVEX DEV</div>
<div class="font-counter-sm text-counter-sm text-on-surface-variant">15 →</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-container-max-width px-margin-edge flex flex-col gap-stack-lg">
<!-- Question -->
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center md:text-left">
            ¿Qué es lo más frustrante al momento de decidir a dónde ir?
        </h1>
<!-- Open Text Input -->
<div class="relative w-full">
<textarea class="w-full h-[130px] bg-surface border border-outline-variant rounded p-gutter-md font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="Lo que más me molesta es…"></textarea>
</div>
</main>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-margin-edge pb-10 bg-transparent">
<div class="w-full max-w-container-max-width mx-auto flex justify-between items-center">
<!-- Ghost Outlined Button (Inactive state translated to ghost per prompt) -->
<button class="font-label-md text-label-md text-on-surface-variant px-6 py-2 border border-outline-variant rounded-full hover:text-primary hover:border-primary transition-colors">
                Saltar
            </button>
<!-- Solid Primary Button (Active state) -->
<button class="font-label-md text-label-md bg-primary text-on-primary px-6 py-2 rounded-full hover:brightness-110 transition-all opacity-100">
                Continuar
            </button>
</div>
</footer>
