<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Cómo decides dónde salir? — Estudio en RD</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080a11">
<link rel="icon" href="../assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<header class="topbar">
  <img src="../assets/logo.png" alt="Korvex Surveys">
  <span class="counter" id="counter"></span>
</header>

<main class="stage" id="stage">
  <div class="slide intro">
    <h1>¿Cómo decides tú a dónde salir?</h1>
    <p>Estamos investigando cómo las personas eligen dónde salir en República Dominicana: a comer, a compartir, o de noche.</p>
    <p>No hay respuestas correctas. Mientras más sincero seas, más nos ayudas. 🙌</p>

    <div class="badges">
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Anónimo
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        3 a 4 minutos
      </span>
      <span class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
        Sin registro
      </span>
    </div>

    <div class="actions">
      <button class="btn" id="begin">Comenzar
        <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <span class="hint">o presiona <kbd>Enter</kbd></span>
    </div>
  </div>
</main>

<div class="navpad">
  <button class="navbtn" id="navUp" disabled aria-label="Pregunta anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <button class="navbtn" id="navDown" aria-label="Siguiente pregunta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </button>
</div>

<div class="foot">KORVEX SURVEYS</div>

<script src="../assets/config.js"></script>
<script src="../assets/engine.js"></script>
<script src="../assets/survey-personas.js"></script>
<script>
(function () {
  var started = false;
  function arrancar() {
    if (started) return;
    started = true;
    var s = new KorvexSurvey({
      surveyType: 'personas',
      questions: window.PREGUNTAS_PERSONAS,
      doneTitle: '¡Gracias! De verdad.',
      doneText: 'Tus respuestas nos ayudan a entender cómo se vive salir en RD. Si dejaste tu contacto, te avisamos cuando haya algo que probar.'
    });
    s.start();
  }
  document.getElementById('begin').addEventListener('click', arrancar);
  document.addEventListener('keydown', function onKey(e) {
    if (e.key === 'Enter' && !started) { e.preventDefault(); arrancar(); }
  });
})();
</script>

</body>
</html>
